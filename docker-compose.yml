services:
  mysql:
    image: mysql:8.0
    container_name: kstu-counseling-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: rootpass
      MYSQL_DATABASE: kstu_counseling
    ports:
      - "3306:3306"
    volumes:
      - kstu_mysql_data:/var/lib/mysql
      - ./server/sql/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro

volumes:
  kstu_mysql_data:
