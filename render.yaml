services:
  - type: web
    name: kstu-counseling-api
    runtime: node
    plan: free
    region: oregon
    rootDir: server
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DB_DRIVER
        value: sqlite
      - key: JWT_SECRET
        generateValue: true
      - key: CLIENT_URL
        value: https://kstu-counseling-platform.vercel.app,https://kstu-counseling-platform-cleopasobbo0-7155s-projects.vercel.app
