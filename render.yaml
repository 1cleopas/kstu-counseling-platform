services:
  - type: web
    name: kstu-counseling-platform
    runtime: node
    plan: free
    region: oregon
    branch: master
    buildCommand: npm run build:deploy
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: NPM_CONFIG_PRODUCTION
        value: "false"
      - key: NODE_VERSION
        value: "22.16.0"
      - key: DB_DRIVER
        value: sqlite
      - key: JWT_SECRET
        generateValue: true
