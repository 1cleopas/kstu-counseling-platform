services:
  - type: web
    name: kstu-counseling-api
    runtime: node
    plan: free
    region: oregon
    branch: master
    buildCommand: npm install --prefix server
    startCommand: npm start --prefix server
    envVars:
      - key: NODE_ENV
        value: production
      - key: DB_DRIVER
        value: sqlite
      - key: JWT_SECRET
        generateValue: true
      - key: CLIENT_URL
        value: https://kstu-counseling-platform.vercel.app
