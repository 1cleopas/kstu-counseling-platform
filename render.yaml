services:
  - type: web
    name: kstu-counseling-platform
    runtime: node
    plan: free
    region: oregon
    branch: master
    buildCommand: npm run build:deploy
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: DB_DRIVER
        value: sqlite
      - key: JWT_SECRET
        generateValue: true
